name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  standards:
    uses: TonyBrobston/engineering-standards/.github/workflows/standards.yml@main
    with:
      runtime: node
      package-manager: npm
      lint-command: npm run lint && npm run typecheck
      test-command: npm test
      coverage-command: npm run test:coverage
